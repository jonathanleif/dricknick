<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Courier Training</title>
<style>
  :root{--asphalt:#161E27;--road:#2A3744;--line:#46586a;--teal:#1ED6C4;--teal-deep:#0E9E92;
    --coral:#FF6B5B;--ink:#EAF6F4;--panel:#0E151C;--panel-line:#26333f;--muted:#7E94A4;
    --gold:#FFD25A;--ica:#E2231A;--locker:#9A8BF0;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#0A0F14;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  #wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;}
  h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-0.02em;}
  h1 span{color:var(--teal);}
  .sub{color:var(--muted);font-size:12px;margin-top:-4px;}
  #stage{position:relative;width:100%;max-width:960px;}
  canvas{width:100%;height:auto;display:block;border-radius:16px;background:var(--asphalt);
    box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px var(--panel-line);cursor:default;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;max-width:960px;width:100%;color:var(--muted);
    font-size:12.5px;line-height:1.4;justify-content:center;}
  .legend b{color:var(--ink);font-weight:600;}
  kbd{background:var(--panel);border:1px solid var(--panel-line);border-bottom-width:2px;border-radius:6px;
    padding:1px 6px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--teal);}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0A0F14;z-index:50;}
  #gatecard{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;
    padding:30px 28px;width:340px;max-width:90vw;box-shadow:0 24px 60px rgba(0,0,0,.55);}
  #gatecard h2{margin:0 0 4px;font-size:18px;font-weight:800;}
  #gatecard h2 span{color:var(--teal);}
  #gatecard p{margin:0 0 18px;color:var(--muted);font-size:12.5px;line-height:1.4;}
  #pw{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--panel-line);
    background:#0A0F14;color:var(--ink);font-size:14px;outline:none;}
  #pw:focus{border-color:var(--teal);}
  #go{width:100%;margin-top:10px;padding:11px;border:none;border-radius:9px;background:var(--teal);
    color:#04201d;font-weight:800;font-size:14px;cursor:pointer;}
  #go:hover{background:var(--teal-deep);color:#fff;}
  #err{min-height:16px;margin-top:8px;color:var(--coral);font-size:12px;}
</style>
</head>
<body>
<div id="gate">
  <div id="gatecard">
    <h2>COURIER <span>TRAINING</span></h2>
    <p>Internal training tool. Enter the access code to continue.</p>
    <input id="pw" type="password" placeholder="Access code" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="go">Enter</button>
    <div id="err"></div>
  </div>
</div>
<div id="wrap" style="display:none;">
  <h1>COURIER <span>TRAINING</span></h1>
  <div class="sub">Commute · check in · load by zone · run the route. Certify at 99% delivery & high CSAT.</div>
  <div id="stage"><canvas id="c" width="960" height="600"></canvas></div>
  <div class="legend">
    <span><b>Drive / walk</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
    <span><b>Brake</b> <kbd>Space</kbd></span>
    <span><b>Menus</b> <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span>
    <span><b>Confirm</b> <kbd>Enter</kbd></span>
    <span><b>Loading</b> = mouse: click to scan, drag to zone</span>
  </div>
</div>
<script>
(function(){
"use strict";
const cv=document.getElementById("c"), ctx=cv.getContext("2d");

/* ===== access gate (client-side speed bump — see note) ===== */
const ACCESS_CODE="courier-2026"; /* <<< EDIT THIS LINE to set your shared access code */
let unlocked=false;
(function gate(){
  const g=document.getElementById("gate"),pw=document.getElementById("pw"),
    go=document.getElementById("go"),err=document.getElementById("err"),wrap=document.getElementById("wrap");
  function tryUnlock(){ if(pw.value===ACCESS_CODE){unlocked=true;g.style.display="none";wrap.style.display="flex";pw.value="";}
    else{err.textContent="Incorrect code — try again.";pw.value="";pw.focus();} }
  go.addEventListener("click",tryUnlock);
  pw.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();e.stopPropagation();tryUnlock();} });
  pw.focus();
})();
const VW=960, VH=600, WORLD_W=2800, WORLD_H=2000;
const C={asphalt:"#161E27",road:"#2A3744",line:"#46586a",teal:"#1ED6C4",tealDeep:"#0E9E92",
  coral:"#FF6B5B",ink:"#EAF6F4",panel:"#0E151C",panelLine:"#26333f",muted:"#7E94A4",gold:"#FFD25A",
  ica:"#E2231A",locker:"#9A8BF0"};
const ZCOL={A:"#FFD25A",B:"#1ED6C4",C:"#9A8BF0",D:"#FF9F6B"};

/* ===== city ===== */
const roadHalf=48;
const roadsV=[240,740,1240,1740,2240,2740], roadsH=[200,700,1200,1700];
function bands(roads,half,max){const s=[];let p=0;
  for(const r of roads){s.push({a:p,b:r-half,road:false});s.push({a:r-half,b:r+half,road:true});p=r+half;}
  s.push({a:p,b:max,road:false});return s;}
const xb=bands(roadsV,roadHalf,WORLD_W), yb=bands(roadsH,roadHalf,WORLD_H);
const roofs=["#3A4856","#41505F","#384450","#46566a","#333f4a"];
const blocks=[]; let bidc=0;
for(const X of xb){ if(X.road) continue;
  for(const Y of yb){ if(Y.road) continue;
    const m=18,x=X.a+m,y=Y.a+m,w=X.b-X.a-2*m,h=Y.b-Y.a-2*m; if(w<60||h<60) continue;
    let below=null,above=null;
    for(const r of roadsH){ if(r>y+h){ if(below===null||r<below)below=r; } else if(r<y){ if(above===null||r>above)above=r; } }
    let side,doorY,parkY;
    if(below!==null&&(above===null||(below-(y+h))<=(y-above))){side="down";doorY=y+h;parkY=below;}
    else if(above!==null){side="up";doorY=y;parkY=above;} else {side="down";doorY=y+h;parkY=y+h+roadHalf;}
    blocks.push({id:bidc++,x,y,w,h,roof:roofs[(bidc*7)%roofs.length],doorX:x+w/2,doorY,parkX:x+w/2,parkY,side});
  }
}
function rectHit(px,py,r,b){const cx=Math.max(b.x,Math.min(px,b.x+b.w)),cy=Math.max(b.y,Math.min(py,b.y+b.h));
  const dx=px-cx,dy=py-cy;return dx*dx+dy*dy<r*r;}
function blocked(px,py,r){for(const b of blocks)if(rectHit(px,py,r,b))return true;return false;}
function onRoad(x,y){for(const r of roadsV)if(Math.abs(x-r)<roadHalf-6)return true;
  for(const r of roadsH)if(Math.abs(y-r)<roadHalf-6)return true;return false;}

/* ===== pedestrians ===== */
let peds=[];
function spawnPed(){let x,y,t=0;do{x=60+Math.random()*(WORLD_W-120);y=60+Math.random()*(WORLD_H-120);t++;}
  while((!onRoad(x,y)||blocked(x,y,8))&&t<60);const a=Math.random()*6.28;
  return{x,y,vx:Math.cos(a)*.55,vy:Math.sin(a)*.55,turn:0,col:Math.random()<.5?"#cdd9e0":"#a9bccb"};}
function updatePeds(f){for(const p of peds){p.turn-=f;
  if(p.turn<=0){const a=Math.random()*6.28,s=.4+Math.random()*.5;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;p.turn=60+Math.random()*120;}
  let nx=p.x+p.vx*f,ny=p.y+p.vy*f;
  if(nx<20||nx>WORLD_W-20)p.vx*=-1;else if(!blocked(nx,p.y,7))p.x=nx;else p.vx*=-1;
  if(ny<20||ny>WORLD_H-20)p.vy*=-1;else if(!blocked(p.x,ny,7))p.y=ny;else p.vy*=-1;}}

/* ===== content ===== */
const STREETS=["Götgatan","Sveavägen","Hornsgatan","Odengatan","Folkungagatan","Vasagatan",
  "Bondegatan","Renstiernas gata","Skånegatan","Ringvägen","Krukmakargatan","Wollmar Yxkullsgatan"];
const NAMES=["Hanna","Mikael","Elsa","Viktor","Astrid","Oskar","Saga","Erik","Nora","Gustav","Liv","Axel"];
const ICAFMT=["ICA Kvantum","ICA Supermarket","ICA Maxi","ICA Nära"];
const ICAAREA=["Farsta","Solbo","Hjärnarp","Liljeholmen","Årsta","Sickla","Kista"];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const SCEN=[
  {fam:"leave",door:"leave",photo:false,txt:"Leave at the door — contactless, no photo needed."},
  {fam:"leave",door:"leave",photo:true ,txt:"Leave at the door — photo proof required."},
  {fam:"answer",door:"ring",final:"handover",txt:"Ring the doorbell. Hand to the recipient."},
  {fam:"answer",door:"knock",final:"handover",txt:"Knock — doorbell broken. Hand over in person."},
  {fam:"answer",door:"ring",final:"id",txt:"Ring. ID check required (age-restricted goods)."},
  {fam:"answer",door:"knock",final:"signature",txt:"Knock. Signature required."},
];
const FINAL_LABEL={handover:"hand-over",id:"ID check",signature:"signature"};
const DOORTXT={leave:"Leave at the door",leave_photo:"Leave at door & take photo",ring:"Ring the doorbell",knock:"Knock"};
const DOOR_ODD={bushes:"Hide it in the bushes",street:"Dump it on the street",neighbour:"Leave with a random neighbour",fake:"Mark delivered, drive off"};
const CUST_STD={handover:"Hand the parcel over",id:"Check ID, then hand over",signature:"Capture signature"};
const CUST_ODD={kick:"Kick the customer",throw:"Throw the parcel at them",forge:"Sign for them yourself",noid:"Hand over, skip the ID check"};
const ODD_NOTE={bushes:"Hiding parcels invites theft — an instant quality fail.",
  street:"Leaving goods loose on the street is abandonment.",
  neighbour:"A random neighbour isn't authorised delivery.",
  fake:"Falsifying a delivery is the most serious breach there is.",
  kick:"Assaulting a customer ends the route and the contract.",
  throw:"Throwing the parcel damages goods and trust.",
  forge:"Signing for the customer is forgery — the signature must be theirs.",
  noid:"Skipping a required ID check on age-restricted goods is illegal."};
function pointLabel(p){return p==="entrance"?"customer entrance":"goods dock";}

/* ===== global state ===== */
let level=1, route=[], parcels=[], stopIdx=0, depot={x:740,y:200};
let score=0, lvScore=0, errors=0, onTimeCount=0, lvDelivered=0, lvCsatSum=0, loadAcc=0;
const M={sar:88,fdsr:88,dda:88};
const career={stops:0,delivered:0,handledOk:0,csatSum:0};
function quality(){return Math.round(0.4*M.fdsr+0.3*M.sar+0.3*M.dda);}
function clampM(){for(const k in M)M[k]=Math.max(0,Math.min(100,M[k]));}
const van={x:740,y:240,angle:-Math.PI/2,speed:0};
const guy={x:0,y:0,active:false,face:1};
let state="TITLE";
let toast="",toastT=0,waitT=0,pulse=0,hitCd=0,flashT=0,shakeT=0,armDrive=false;
function setToast(t){toast=t;toastT=2.8;}
function resetCareer(){career.stops=0;career.delivered=0;career.handledOk=0;career.csatSum=0;
  score=0;M.sar=88;M.fdsr=88;M.dda=88;}

/* ===== level build ===== */
const STOPS=15, PCOUNT=25;
function stopZone(i){const f=i/route.length; return f<0.27?"A":f<0.54?"B":f<0.8?"C":"D";}
function buildLevel(n){
  level=n; lvScore=0; errors=0; onTimeCount=0; lvDelivered=0; lvCsatSum=0;
  const pedCount=18+(n-1)*8, etaMult=Math.max(0.55,1.05-(n-1)*0.13), oddDoor=Math.min(2,1+Math.floor((n-1)/2));
  peds=[];for(let i=0;i<pedCount;i++)peds.push(spawnPed());
  const pool=shuffle(blocks.slice()).slice(0,Math.min(STOPS+10,blocks.length));
  const chosen=[];let cx=depot.x,cy=depot.y;const avail=pool.slice();
  while(chosen.length<STOPS&&avail.length){let bi=0,bd=1e9;
    for(let i=0;i<avail.length;i++){const d=Math.abs(avail[i].parkX-cx)+Math.abs(avail[i].parkY-cy);if(d<bd){bd=d;bi=i;}}
    const h=avail.splice(bi,1)[0];chosen.push(h);cx=h.parkX;cy=h.parkY;}
  // base 1 parcel each, then distribute extras up to PCOUNT
  const counts=chosen.map(()=>1); let extra=PCOUNT-STOPS;
  while(extra>0){const i=Math.floor(Math.random()*STOPS); if(counts[i]<3){counts[i]++;extra--;}}
  parcels=[];route=[];let pc=0;
  chosen.forEach((h,i)=>{
    const r=Math.random(); let type=r<0.25?"locker":r<0.5?"ica":"home";
    if(type==="locker"&&counts[i]>1) type="home"; // lockers single parcel
    let scen,entranceX=0,dockX=0;
    if(type==="home"){ scen={...pick(SCEN)}; if(scen.fam==="answer"&&Math.random()<0.32) scen.absent=true; }
    else if(type==="ica"){ const point=Math.random()<0.5?"entrance":"dock";
      scen={type:"ica",point,store:pick(ICAFMT)+" "+pick(ICAAREA)}; entranceX=h.x+h.w*0.3;dockX=h.x+h.w*0.7; }
    else { scen={type:"locker",box:1+Math.floor(Math.random()*12)}; }
    const ids=[];for(let k=0;k<counts[i];k++){const id="AM-"+(1000+pc++);ids.push(id);parcels.push({id,stop:i});}
    let txt = type==="home"?scen.txt
      : type==="ica"?(scen.store+" — deliver to the "+pointLabel(scen.point)+". Hand to staff and confirm scan-in.")
      : ("iBoxen locker — place the parcel in box "+scen.box+".");
    route.push({house:h,type,scen,name:pick(NAMES),addr:pick(STREETS)+" "+(2+Math.floor(Math.random()*88)),
      parcelIds:ids,oddDoorN:oddDoor,etaMult,txt,frontY:h.doorY,entranceX,dockX,
      done:false,late:false,eta:0,timer:0,wrongPoint:false});
  });
  stopIdx=0; van.x=depot.x; van.y=depot.y+roadHalf+8; van.angle=-Math.PI/2; van.speed=0; guy.active=false;
  buildLoadCage();
}
function curStop(){return route[stopIdx];}
function assignETA(){const s=curStop();const d=Math.abs(van.x-s.house.parkX)+Math.abs(van.y-s.house.parkY);
  s.eta=Math.max(14,Math.round(d/520*22*s.etaMult)+10); s.timer=s.eta; s.late=false; armDrive=false;}

/* ===== loading data ===== */
const load={cage:[],zones:{A:0,B:0,C:0,D:0},errors:0,total:0};
function buildLoadCage(){
  load.zones={A:0,B:0,C:0,D:0}; load.errors=0;
  const cage=[];
  parcels.forEach((p,idx)=>{cage.push({id:p.id,zone:stopZone(p.stop),scan:"new",
    scanFail1:Math.random()<0.18,scanFail2:false,placed:false,returned:false,missort:false});});
  for(let i=0;i<2;i++)cage.push({id:"AM-"+(9000+i),zone:pick(["A","B","C","D"]),scan:"new",
    scanFail1:true,scanFail2:true,placed:false,returned:false,missort:true});
  load.cage=shuffle(cage); load.total=cage.length;
}
function loadComplete(){return load.cage.every(c=>c.placed||c.returned);}

/* ===== menus ===== */
let menuSel=0, doorMenu=[], custMenu=[], icaMenu=[], failMenu=[];
let chosenDoorId=null, chosenCustId=null, icaChoice=null, parcelOK=true;
let selParcels=new Set(), parcelChoices=[];
let boxSel=0, boxSelNum=0;
let na={calls:0,bell:false,action:null,reason:null};
function buildDoorMenu(s){const sc=s.scen,items=[];
  if(sc.fam==="answer"){items.push({id:"ring",t:DOORTXT.ring});items.push({id:"knock",t:DOORTXT.knock});items.push({id:"leave",t:DOORTXT.leave});}
  else{items.push({id:sc.photo?"leave_photo":"leave",t:DOORTXT[sc.photo?"leave_photo":"leave"]});
    items.push({id:sc.photo?"leave":"leave_photo",t:DOORTXT[sc.photo?"leave":"leave_photo"]});items.push({id:"ring",t:DOORTXT.ring});}
  for(const k of shuffle(Object.keys(DOOR_ODD)).slice(0,s.oddDoorN))items.push({id:k,t:DOOR_ODD[k],odd:true});
  return shuffle(items);}
function buildCustMenu(s){const need=s.scen.final,items=[{id:need,t:CUST_STD[need]}];
  for(const k of ["handover","id","signature"])if(k!==need)items.push({id:k,t:CUST_STD[k]});
  for(const k of shuffle(Object.keys(CUST_ODD)).slice(0,2))items.push({id:k,t:CUST_ODD[k],odd:true});
  return shuffle(items).slice(0,5);}
function buildICAMenu(){return shuffle([
  {id:"confirm",t:"Hand to staff & wait for them to scan it in"},
  {id:"counter",t:"Leave on the counter, mark delivered"},
  {id:"markonly",t:"Mark delivered — staff look busy",odd:true},
  {id:"dump",t:"Leave it by the entrance and go",odd:true}]);}
function buildNAMenu(){return [
  {id:"call",t:na.calls===0?"Call the customer":"Call the customer again ("+na.calls+" so far)"},
  {id:"bell",t:"Ring the doorbell again"},{id:"leave",t:"Leave it at the door anyway"},
  {id:"fail",t:"Fail the delivery"},{id:"fake",t:"Mark as delivered",odd:true}];}
function buildFailMenu(){const items=[{id:"nothome",t:"Recipient not at home"},
  {id:"refused",t:"Customer refused delivery"},{id:"address",t:"Address not found"},
  {id:"access",t:"Couldn't access the building"},{id:"damaged",t:"Parcel damaged"}];
  return shuffle([items[0]].concat(shuffle(items.slice(1)).slice(0,3)));}

/* ===== input: keyboard ===== */
const keys={};
window.addEventListener("keydown",e=>{if(!unlocked)return;keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
  if(e.repeat)return;discrete(e.code);});
window.addEventListener("keyup",e=>{if(!unlocked)return;keys[e.code]=false;});
function discrete(code){
  const up=code==="ArrowUp",down=code==="ArrowDown",left=code==="ArrowLeft",right=code==="ArrowRight";
  const enter=code==="Enter"||code==="NumpadEnter";
  switch(state){
    case "TITLE": if(enter){resetCareer();buildLevel(1);startHighway();} break;
    case "CUTSCENE": if(enter)advanceCut(); break;
    case "TERMINAL": if(enter)terminalEnter(); break;
    case "LOADING": if(enter&&loadComplete())onLoadingDone(); break;
    case "PARCEL":
      if(up)menuSel=(menuSel+parcelChoices.length)%(parcelChoices.length+1);
      if(down)menuSel=(menuSel+1)%(parcelChoices.length+1);
      if(enter){ if(menuSel<parcelChoices.length){const k=menuSel;selParcels.has(k)?selParcels.delete(k):selParcels.add(k);}
        else{const need=curStop().parcelIds.length; if(selParcels.size!==need)setToast("Pick exactly "+need+" parcel(s)");
          else{parcelOK=checkParcels();startWalk();}}} break;
    case "DOOR": if(up)menuSel=(menuSel+doorMenu.length-1)%doorMenu.length; if(down)menuSel=(menuSel+1)%doorMenu.length;
      if(enter)chooseDoor(doorMenu[menuSel]); break;
    case "CUST": if(up)menuSel=(menuSel+custMenu.length-1)%custMenu.length; if(down)menuSel=(menuSel+1)%custMenu.length;
      if(enter){chosenCustId=custMenu[menuSel].id;resolveStop();} break;
    case "ICAHAND": if(up)menuSel=(menuSel+icaMenu.length-1)%icaMenu.length; if(down)menuSel=(menuSel+1)%icaMenu.length;
      if(enter){icaChoice=icaMenu[menuSel].id;resolveStop();} break;
    case "NOANSWER": { const m=buildNAMenu(); if(up)menuSel=(menuSel+m.length-1)%m.length; if(down)menuSel=(menuSel+1)%m.length;
      if(enter)chooseNA(m[menuSel]); } break;
    case "FAILREASON": if(up)menuSel=(menuSel+failMenu.length-1)%failMenu.length; if(down)menuSel=(menuSel+1)%failMenu.length;
      if(enter){na.reason=failMenu[menuSel].id;resolveStop();} break;
    case "LOCKER": { const col=boxSel%4,row=Math.floor(boxSel/4);
      if(left&&col>0)boxSel--; if(right&&col<3)boxSel++; if(up&&row>0)boxSel-=4; if(down&&row<2)boxSel+=4;
      if(enter){boxSelNum=boxSel+1;resolveStop();} } break;
    case "RESULT": if(enter)advance(); break;
    case "SCORECARD": if(enter)nextLevel(); break;
    case "GAMEOVER": if(enter){resetCareer();buildLevel(1);startHighway();} break;
  }
}
/* ===== input: mouse ===== */
let mx=0,my=0,drag=null;
function toCv(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*(VW/r.width),(e.clientY-r.top)*(VH/r.height)];}
cv.addEventListener("mousedown",e=>{const [x,y]=toCv(e);mx=x;my=y;
  if(state==="LOADING")loadDown(x,y);
  else if(state==="CUTSCENE")advanceCut();});
cv.addEventListener("mousemove",e=>{const [x,y]=toCv(e);mx=x;my=y;});
cv.addEventListener("mouseup",e=>{const [x,y]=toCv(e);mx=x;my=y; if(state==="LOADING")loadUp(x,y);});

/* ===== sequence wiring ===== */
function startHighway(){hw.x=VW/2;hw.prog=0;hw.cars=[];hw.offset=0;hw.timer=0;state="HIGHWAY";}
function onHighwayDone(){startTerminal();}
function onTerminalDone(){startCutscene("CAGE "+term.cage+" FOUND",
  ["You've checked in and located your cage.","Time to load the van — by zone, in delivery order."],goLoading);}
function goLoading(){state="LOADING";drag=null;}
function onLoadingDone(){ loadAcc=Math.max(0,Math.round((1-load.errors/Math.max(1,load.total))*100));
  startCutscene("VAN LOADED",["25 parcels aboard for 15 stops.","Loading accuracy "+loadAcc+"%. Roll out and run the route."],goRoute);}
function goRoute(){assignETA();state="DRIVING";setToast("Route started — stop 1 of "+route.length);}
function nextLevel(){buildLevel(level+1);
  startCutscene("BACK AT THE TERMINAL",["New shift, new cage. Level "+level+".","Load up and head out again."],goLoading);}

const hw={x:VW/2,prog:0,target:100,cars:[],offset:0,timer:0};
const HW_L=VW/2-170, HW_R=VW/2+170;
function updateHighway(dt,f){
  hw.prog=Math.min(100,hw.prog+dt*9); hw.offset+=dt*420;
  if(keys["KeyA"])hw.x-=4.2*f; if(keys["KeyD"])hw.x+=4.2*f;
  hw.x=Math.max(HW_L+26,Math.min(HW_R-26,hw.x));
  hw.timer-=dt; if(hw.timer<=0){hw.timer=0.55+Math.random()*0.5;
    const lanes=[HW_L+60,VW/2,HW_R-60]; hw.cars.push({x:pick(lanes)+(Math.random()*30-15),y:-60,vy:300+Math.random()*120});}
  const vy=VH-130;
  for(const c of hw.cars){ c.y+=c.vy*dt;
    if(Math.abs(c.x-hw.x)<40&&Math.abs(c.y-vy)<54&&!c.hit){ c.hit=true; M.dda-=4;clampM();
      score=Math.max(0,score-30);hw.prog=Math.max(0,hw.prog-4);shakeT=0.35;setToast("Clipped a car — careful out there");}}
  hw.cars=hw.cars.filter(c=>c.y<VH+80);
  if(hw.prog>=100)onHighwayDone();
}
function renderHighway(){
  ctx.fillStyle="#10161d";ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#222e3a";ctx.fillRect(HW_L-30,0,(HW_R-HW_L)+60,VH);
  ctx.fillStyle=C.road;ctx.fillRect(HW_L,0,HW_R-HW_L,VH);
  ctx.strokeStyle="#cdb24a";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(HW_L,0);ctx.lineTo(HW_L,VH);ctx.moveTo(HW_R,0);ctx.lineTo(HW_R,VH);ctx.stroke();
  ctx.strokeStyle=C.line;ctx.lineWidth=4;ctx.setLineDash([30,30]);ctx.lineDashOffset=-(hw.offset%60);
  for(const lx of [HW_L+ (HW_R-HW_L)/3, HW_L+2*(HW_R-HW_L)/3]){ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,VH);ctx.stroke();}
  ctx.setLineDash([]);ctx.lineDashOffset=0;
  for(const c of hw.cars){ctx.save();ctx.translate(c.x,c.y);
    ctx.fillStyle="rgba(0,0,0,.4)";rr(-18,-30,38,62,7);ctx.fill();
    ctx.fillStyle=c.hit?"#7a4a4a":"#5a6b7a";rr(-19,-31,38,62,7);ctx.fill();
    ctx.fillStyle="#23303c";rr(-13,-22,26,18,4);ctx.fill();ctx.restore();}
  let sx=0,sy=0; if(shakeT>0){const m=shakeT/0.35*6;sx=(Math.random()-.5)*m;sy=(Math.random()-.5)*m;}
  drawVanShape(hw.x+sx,VH-130+sy,-Math.PI/2,1.15);
  // hud
  panel(VW/2-180,18,360,46,.92);
  txt("COMMUTE TO TERMINAL",VW/2,40,12,C.teal,800,"center");
  bar(VW/2-150,48,300,8,hw.prog,C.teal);
  prompt("Steer with A / D to dodge traffic");
}

/* ===== terminal ===== */
const term={x:VW/2,y:VH-70,cage:0,cages:[],checkedIn:false,reception:null};
function startTerminal(){
  term.x=VW/2;term.y=VH-70;term.checkedIn=false;
  term.cage=21+Math.floor(Math.random()*18);
  const nums=new Set([term.cage]); while(nums.size<6)nums.add(21+Math.floor(Math.random()*18));
  term.cages=shuffle([...nums]).map((n,i)=>({n,x:90+i*130,y:96,w:104,h:84}));
  term.reception={x:VW/2-70,y:300,w:140,h:64};
  state="TERMINAL";
}
function termSolids(){return term.cages.map(c=>({x:c.x,y:c.y,w:c.w,h:c.h}));}
function termBlocked(px,py){for(const s of termSolids())if(px>s.x-9&&px<s.x+s.w+9&&py>s.y-9&&py<s.y+s.h+9)return true;return false;}
function updateTerminal(f){const s=2.4*f;let dx=0,dy=0;
  if(keys["KeyW"])dy-=1;if(keys["KeyS"])dy+=1;if(keys["KeyA"]){dx-=1;}if(keys["KeyD"]){dx+=1;}
  if(dx&&dy){dx*=.707;dy*=.707;}
  const nx=term.x+dx*s,ny=term.y+dy*s;
  if(nx>20&&nx<VW-20&&!termBlocked(nx,term.y))term.x=nx;
  if(ny>20&&ny<VH-20&&!termBlocked(term.x,ny))term.y=ny;
  if(term.checkedIn){ for(const c of term.cages){
    if(term.x>c.x-6&&term.x<c.x+c.w+6&&term.y>c.y+c.h&&term.y<c.y+c.h+40){
      if(c.n===term.cage)onTerminalDone();
      else setToast("That's cage "+c.n+" — yours is "+term.cage); break; } } }
}
function terminalEnter(){const r=term.reception;
  if(term.x>r.x-30&&term.x<r.x+r.w+30&&term.y>r.y-30&&term.y<r.y+r.h+40){
    if(!term.checkedIn){term.checkedIn=true;setToast("Checked in. Now find cage "+term.cage);}}
  else if(!term.checkedIn) setToast("Go to reception (centre) and press Enter to check in");
}
function renderTerminal(){

    ctx.fillStyle=mine?"rgba(30,214,196,.15)":"#2c3a47";rr(c.x,c.y,c.w,c.h,8);ctx.fill();

    txtW(String(c.n),c.x+c.w/2,c.y+c.h/2+18,20,mine?C.teal:C.ink,800,"center");}
  // reception
  const r=term.reception;ctx.fillStyle=C.tealDeep;rr(r.x,r.y,r.w,r.h,8);ctx.fill();
  txtW("RECEPTION",r.x+r.w/2,r.y+r.h/2+5,12,"#04201d",800,"center");

    rr(r.x-6,r.y-6,r.w+12,r.h+12,10);ctx.stroke();ctx.globalAlpha=1;}
  // courier
  ctx.save();ctx.translate(term.x,term.y);
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(0,9,8,3,0,0,6.28);ctx.fill();
  ctx.fillStyle=C.teal;rr(-6,-8,12,16,4);ctx.fill();ctx.fillStyle="#f2d3b0";ctx.beginPath();ctx.arc(0,-11,5,0,6.28);ctx.fill();ctx.restore();
  panel(16,16,300,64,.92);
  txt("TERMINAL CHECK-IN",28,38,12,C.teal,800);
  txt("Your cage: #"+term.cage,28,58,14,C.gold,800);
  txt(term.checkedIn?"Walk to your cage":"Check in at reception (Enter)",150,58,12.5,C.muted,600);
  prompt(term.checkedIn?"Find cage "+term.cage+" and walk up to it":"WASD to move · reach reception and press Enter");

const CAGE={x:16,y:84,w:404,h:500};

function zoneRects(){const b=VANBOX, cw=130,ch=98,gx=b.x+26,gy=b.y+24,gap=8;
  return {D:{x:gx,y:gy,w:cw,h:ch},B:{x:gx+cw+gap,y:gy,w:cw,h:ch},
    C:{x:gx,y:gy+ch+gap,w:cw,h:ch},A:{x:gx+cw+gap,y:gy+ch+gap,w:cw,h:ch}};}
const RETBIN={x:452,y:400,w:230,h:96};
const DEPART={x:702,y:430,w:230,h:54};
function layoutCage(){const rem=load.cage.filter(c=>!c.placed&&!c.returned);
  const cols=4,cw=92,chh=54,gap=6,sx=CAGE.x+14,sy=CAGE.y+58;
  return rem.map((c,i)=>{const col=i%cols,row=Math.floor(i/cols);
    return {parcel:c,x:sx+col*(cw+gap),y:sy+row*(chh+gap),w:cw,h:chh};});}
function inRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
function dropZoneAt(x,y){const z=zoneRects();for(const k of ["A","B","C","D"])if(inRect(x,y,z[k]))return k;
  if(inRect(x,y,RETBIN))return "RET";return null;}
function loadDown(x,y){
  if(loadComplete()&&inRect(x,y,DEPART)){onLoadingDone();return;}
  for(const card of layoutCage()){ if(inRect(x,y,card)){ const c=card.parcel;
    if(c.scan==="new"){ c.scan=c.scanFail1?"fail":"ok"; setToast(c.scan==="fail"?"Scan failed — click again to retry":"Scanned. Drag to zone "+c.zone+"."); }
    else if(c.scan==="fail"){ c.scan=c.scanFail2?"missort":"ok"; setToast(c.scan==="missort"?"Won't scan — likely missorted. Drag to Return to staff.":"Scanned. Drag to zone "+c.zone+"."); }
    else { drag={parcel:c,ox:x-card.x,oy:y-card.y,w:card.w,h:card.h}; }
    return; } }
}
function loadUp(x,y){ if(!drag)return; const c=drag.parcel,z=dropZoneAt(x,y);
  if(c.scan==="missort"){ if(z==="RET"){c.returned=true;setToast("Returned to staff — good catch.");}
    else if(z){load.errors++;setToast("That one won't scan — it goes back to staff, not the van.");} }
  else { if(z==="RET"){load.errors++;setToast("That's a valid parcel — load it by its zone.");}
    else if(z===c.zone){c.placed=true;load.zones[z]++;setToast("Loaded into zone "+z+".");}
    else if(z){load.errors++;setToast("Wrong zone — that parcel is zone "+c.zone+".");} }
  drag=null; if(loadComplete())setToast("All loaded — click DEPART (or press Enter).");
}

function drawParcel(c,x,y,w,h,lift){

}

/* ===== route flow ===== */
function placeGuy(){const s=curStop();guy.x=van.x;guy.y=van.y+(s.house.side==="down"?-14:14);}
function startWalk(){guy.active=true;placeGuy();state="ONFOOT";
  const s=curStop();setToast(s.type==="ica"?"Walk to the "+pointLabel(s.scen.point):s.type==="locker"?"Walk to the locker":"Walk to the door");}
function checkParcels(){const need=curStop().parcelIds.slice().sort().join(",");
  const got=[...selParcels].map(i=>parcelChoices[i].id).sort().join(",");return need===got;}
function arriveStop(){const s=curStop();
  if((s.type==="home"||s.type==="ica")&&s.parcelIds.length>1){
    const req=s.parcelIds.map(id=>({id,req:true}));
    const others=shuffle(parcels.filter(p=>p.stop!==stopIdx)).slice(0,6-req.length).map(p=>({id:p.id,req:false}));
    parcelChoices=shuffle(req.concat(others));selParcels=new Set();menuSel=0;
    state="PARCEL";setToast("Pick the right "+s.parcelIds.length+" parcels for this stop");
  } else {parcelOK=true;startWalk();}
}
function chooseDoor(o){chosenDoorId=o.id;chosenCustId=null;
  if((o.id==="ring"||o.id==="knock")&&curStop().scen.fam==="answer"){state="DOORWAIT";waitT=1.2;} else resolveStop();}
function chooseNA(o){ if(o.id==="call"){state="CALLING";waitT=1.3;}
  else if(o.id==="bell"){na.bell=true;setToast("No answer — calling is the next step, not the bell.");}
  else if(o.id==="leave"){na.action="leave";resolveStop();}
  else if(o.id==="fake"){na.action="fake";resolveStop();}
  else if(o.id==="fail"){na.action="fail";failMenu=buildFailMenu();menuSel=0;state="FAILREASON";} }

/* ===== resolve ===== */
let resHead="",resScore=0,resNotes=[],resOK=false;
function finalize(val,notes,ok,delivered,rude,s){
  const onTime=!s.late;
  if(!onTime){val-=25;M.sar-=5;notes.push("Late to the stop — the ETA was missed.");}
  else{M.sar+=2;onTimeCount++;}
  if(ok&&onTime){M.fdsr+=3;M.dda+=1;}
  clampM(); if(!ok)errors++;
  const csat = rude?8 : (delivered?((onTime?100:84)-(ok?0:12)) : (ok?72:45));
  const add=Math.max(0,Math.round(val));score+=add;lvScore+=add;
  lvDelivered+=delivered?1:0; lvCsatSum+=csat;
  career.stops++; career.delivered+=delivered?1:0; career.handledOk+=ok?1:0; career.csatSum+=csat;
  resHead=ok?(onTime?"HANDLED BY THE BOOK":"CORRECT — BUT LATE"):"NEEDS WORK";
  resScore=add;resNotes=notes;resOK=ok;s.done=true;state="RESULT";
}
function resolveStop(){const s=curStop();
  if(s.type==="ica")return resolveICA(s); if(s.type==="locker")return resolveLocker(s); return resolveHome(s);}
function resolveHome(s){const sc=s.scen;let val=150;const notes=[];let ok=true,delivered=true,rude=false;
  if(!parcelOK){ok=false;delivered=false;val-=80;M.fdsr-=10;M.dda-=4;notes.push("Wrong parcel handed out — someone got another customer's order.");}
  const doorOdd=DOOR_ODD[chosenDoorId]!==undefined, custOdd=chosenCustId&&CUST_ODD[chosenCustId]!==undefined;
  if(doorOdd){ok=false;delivered=false;rude=true;val=-90;M.fdsr-=16;M.sar-=12;M.dda-=14;notes.push(ODD_NOTE[chosenDoorId]);}
  else if(custOdd){ok=false;delivered=false;rude=true;val=-90;M.fdsr-=16;M.sar-=12;M.dda-=14;notes.push(ODD_NOTE[chosenCustId]);}
  else if(sc.fam==="leave"){const want=sc.photo?"leave_photo":"leave";
    if(chosenDoorId===want)notes.push("Correct: left at the door"+(sc.photo?" with a proof photo.":", contactless."));
    else if(sc.photo&&chosenDoorId==="leave"){ok=false;val-=35;M.fdsr-=6;notes.push("Photo proof was required and you skipped it.");}
    else if(chosenDoorId==="leave_photo"&&!sc.photo){val-=8;notes.push("Minor: photo wasn't needed, but no harm.");}
    else if(chosenDoorId==="ring"||chosenDoorId==="knock"){val-=20;notes.push("Instruction was contactless — no need to disturb the customer.");}}
  else if(!sc.absent){
    if(chosenDoorId==="leave"){ok=false;delivered=false;val-=60;M.fdsr-=8;notes.push("This stop required handing it over — leaving it is a failed delivery.");}
    else{ if(chosenDoorId!==sc.door){val-=15;notes.push("Minor: instruction said "+(sc.door==="ring"?"ring":"knock")+".");}
      if(chosenCustId===sc.final)notes.push("Correct: "+FINAL_LABEL[sc.final]+" completed as instructed.");
      else{ok=false;val-=55;M.fdsr-=8;notes.push("Wrong proof of delivery — this stop needed a "+FINAL_LABEL[sc.final]+".");}}}
  else{ // absent
    if(chosenDoorId==="leave"){ok=false;delivered=false;val-=55;M.fdsr-=8;notes.push("You left a personal delivery at the door without even trying contact.");}
    else{ if(chosenDoorId!==sc.door){val-=10;notes.push("Minor: instruction said "+(sc.door==="ring"?"ring":"knock")+".");}
      if(na.bell){val-=10;notes.push("You rang repeatedly — don't spam the bell, call the customer instead.");}
      if(na.action==="fake"){ok=false;delivered=false;rude=true;val=-90;M.fdsr-=16;M.sar-=12;M.dda-=14;notes.push("Marked delivered without delivering — the parcel never reached the customer. Fraud.");}
      else if(na.action==="leave"){ok=false;delivered=false;val-=55;M.fdsr-=8;notes.push("Personal delivery — you can't abandon it at the door when no one's home.");}
      else if(na.action==="fail"){ delivered=false;
        if(na.calls<2){ok=false;val-=35;M.fdsr-=5;notes.push("You must attempt contact — two calls — before failing a personal delivery.");}
        if(na.reason!=="nothome"){ok=false;val-=30;notes.push("Wrong failure reason — the recipient was simply not home.");}
        if(na.calls>=2&&na.reason==="nothome")notes.push("Correct: two call attempts, then failed with 'recipient not home'. Not delivered, but handled by the book.");}}}
  finalize(val,notes,ok,delivered,rude,s);
}
function resolveICA(s){const sc=s.scen;let val=150;const notes=[];let ok=true,delivered=true,rude=false;
  if(!parcelOK){ok=false;delivered=false;val-=80;M.fdsr-=10;notes.push("Wrong parcel for this store.");}

  else{ok=false;delivered=false;rude=true;val=-90;M.fdsr-=16;M.sar-=12;M.dda-=14;notes.push("No real handover — a false completion. The store never took the parcel.");}

}
function resolveLocker(s){const sc=s.scen;let val=150;const notes=[];let ok=true,delivered=true;

function advance(){guy.active=false;chosenDoorId=null;chosenCustId=null;icaChoice=null;na={calls:0,bell:false,action:null,reason:null};
  if(stopIdx>=route.length-1){ if(quality()<35){state="GAMEOVER";return;} state="SCORECARD";return; }
  stopIdx++;assignETA();state="DRIVING";setToast("Next: stop "+(stopIdx+1)+" of "+route.length+" · "+typeTag(curStop()));}
function typeTag(s){return s.type==="ica"?"ICA store":s.type==="locker"?"iBoxen locker":"home delivery";}

/* ===== loop ===== */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;const f=Math.min(dt*60,3);
  pulse+=dt;toastT=Math.max(0,toastT-dt);if(hitCd>0)hitCd-=dt;flashT=Math.max(0,flashT-dt);shakeT=Math.max(0,shakeT-dt);
  if(state==="HIGHWAY")updateHighway(dt,f);
  else if(state==="TERMINAL")updateTerminal(f);
  else if(["DRIVING","ONFOOT","DOORWAIT","CALLING"].includes(state)){
    updatePeds(f);
    if(state==="DRIVING"){ driveVan(f);const s=curStop();
      s.timer-=dt;if(s.timer<=0){s.timer=0;if(!s.late){s.late=true;setToast("ETA missed — keep moving");}}
      if(hitCd<=0&&Math.abs(van.speed)>0.6){for(const p of peds){if(Math.hypot(p.x-van.x,p.y-van.y)<24){
        M.dda-=8;M.sar-=4;clampM();score=Math.max(0,score-100);lvScore=Math.max(0,lvScore-100);
        s.timer=Math.max(0,s.timer-8);hitCd=1.3;flashT=0.4;shakeT=0.45;van.speed*=0.25;
        setToast("PEDESTRIAN INCIDENT — heavy penalty, −8s. Slow down near people.");
        const np=spawnPed();p.x=np.x;p.y=np.y;break;}}}
      if(Math.abs(van.speed)>1.2)armDrive=true;
      const d=Math.hypot(van.x-s.house.parkX,van.y-s.house.parkY);
      if(armDrive&&d<60&&Math.abs(van.speed)<0.8){van.speed=0;arriveStop();}
    } else if(state==="ONFOOT"){ walkGuy(f);const s=curStop();
      if(s.type==="home"){ if(Math.hypot(guy.x-s.house.doorX,guy.y-s.house.doorY)<34){doorMenu=buildDoorMenu(s);menuSel=0;state="DOOR";} }
      else if(s.type==="locker"){ if(Math.hypot(guy.x-s.house.doorX,guy.y-s.house.doorY)<34){boxSel=0;state="LOCKER";} }
      else { const cor=s.scen.point==="entrance"?[s.entranceX,s.frontY]:[s.dockX,s.frontY];
        const wr=s.scen.point==="entrance"?[s.dockX,s.frontY]:[s.entranceX,s.frontY];
        if(Math.hypot(guy.x-cor[0],guy.y-cor[1])<30){icaMenu=buildICAMenu();menuSel=0;state="ICAHAND";}
        else if(Math.hypot(guy.x-wr[0],guy.y-wr[1])<30&&!s.wrongPoint){s.wrongPoint=true;
          setToast("That's the "+pointLabel(s.scen.point==="entrance"?"dock":"entrance")+" — this parcel goes to the "+pointLabel(s.scen.point)+".");} }
    } else if(state==="DOORWAIT"){ waitT-=dt;if(waitT<=0){ if(curStop().scen.absent){na={calls:0,bell:false,action:null,reason:null};menuSel=0;state="NOANSWER";}
      else{custMenu=buildCustMenu(curStop());menuSel=0;state="CUST";} } }
    else if(state==="CALLING"){ waitT-=dt;if(waitT<=0){na.calls++;setToast("Called — no answer.");menuSel=0;state="NOANSWER";} }
  }
  render();requestAnimationFrame(loop);
}
function driveVan(f){const accel=.13,fr=.94,maxF=3.5,maxR=1.6,turn=.046;
  if(keys["KeyW"])van.speed+=accel*f; if(keys["KeyS"])van.speed-=accel*f;
  if(keys["Space"])van.speed*=Math.pow(.86,f);
  if(!keys["KeyW"]&&!keys["KeyS"]&&!keys["Space"])van.speed*=Math.pow(fr,f);
  van.speed=Math.max(-maxR,Math.min(maxF,van.speed));
  const tf=turn*Math.min(1,Math.abs(van.speed))*f*(van.speed<0?-1:1);
  if(keys["KeyA"])van.angle-=tf; if(keys["KeyD"])van.angle+=tf;
  let nx=van.x+Math.cos(van.angle)*van.speed*f,ny=van.y+Math.sin(van.angle)*van.speed*f;
  if(nx>16&&nx<WORLD_W-16&&!blocked(nx,van.y,15))van.x=nx;else van.speed*=.4;
  if(ny>16&&ny<WORLD_H-16&&!blocked(van.x,ny,15))van.y=ny;else van.speed*=.4;}
function walkGuy(f){const s=2.3*f;let dx=0,dy=0;
  if(keys["KeyW"])dy-=1;if(keys["KeyS"])dy+=1;if(keys["KeyA"]){dx-=1;guy.face=-1;}if(keys["KeyD"]){dx+=1;guy.face=1;}
  if(dx&&dy){dx*=.707;dy*=.707;}
  const nx=guy.x+dx*s,ny=guy.y+dy*s;
  if(nx>10&&nx<WORLD_W-10&&!blocked(nx,guy.y,9))guy.x=nx;
  if(ny>10&&ny<WORLD_H-10&&!blocked(guy.x,ny,9))guy.y=ny;}

  let yy=y+62;for(const n of resNotes){ctx.fillStyle=C.gold;ctx.beginPath();ctx.arc(x+30,yy-4,3,0,6.28);ctx.fill();
    yy=wrapText(n,x+42,yy,w-66,12.5,C.muted)+18;}
  txt("Press Enter — continue",x+24,y+h-18,12.5,C.muted,600);txt("Service Quality "+quality()+"%",x+w-24,y+h-18,12.5,C.muted,600,"right");ctx.textAlign="left";}
function scoreCard(){
  ctx.fillStyle="rgba(8,12,16,.78)";ctx.fillRect(0,0,VW,VH);
  const w=560,h=380,x=VW/2-w/2,y=VH/2-h/2;panel(x,y,w,h,.98);
  txt("LEVEL "+level+" SCORECARD",x+28,y+40,20,C.teal,800);
  const dr=Math.round(lvDelivered/route.length*100), ot=Math.round(onTimeCount/route.length*100), cs=Math.round(lvCsatSum/route.length);
  const rows=[["Delivered",lvDelivered+"/"+route.length],["Delivery rate",dr+"%"],["On-time",ot+"%"],
    ["Errors",String(errors)],["Loading accuracy",loadAcc+"%"],["Customer satisfaction",cs+"%"],["Service Quality",quality()+"%"]];
  let yy=y+74; for(const [k,v] of rows){txt(k,x+28,yy,13,C.muted,600);
    mono(v,x+250,yy,14,(k==="Delivery rate"&&dr>=99)||(k==="Customer satisfaction"&&cs>=90)?C.teal:C.ink);yy+=26;}
  // career + certification
  const cr=career.stops?Math.round(career.delivered/career.stops*100):0, ccs=career.stops?Math.round(career.csatSum/career.stops):0;
  const cert = career.stops>=15 && cr>=99 && ccs>=90;
  const cx2=x+330,cw2=200,cy2=y+74;
  panel(cx2,cy2,cw2,h-110,.6);
  txt("CERTIFICATION",cx2+16,cy2+26,12,C.gold,800);
  txt("Career delivery rate",cx2+16,cy2+52,11.5,C.muted,600);mono(cr+"%",cx2+cw2-16,cy2+52,15,cr>=99?C.teal:C.ink,"right");
  bar(cx2+16,cy2+60,cw2-32,7,cr,cr>=99?C.teal:C.gold);
  txt("Career CSAT",cx2+16,cy2+92,11.5,C.muted,600);mono(ccs+"%",cx2+cw2-16,cy2+92,15,ccs>=90?C.teal:C.ink,"right");
  bar(cx2+16,cy2+100,cw2-32,7,ccs,ccs>=90?C.teal:C.gold);
  txt("Target: 99% delivery · 90% CSAT",cx2+16,cy2+128,10.5,C.muted,600);
  txt(cert?"✓ CERTIFIED TO DRIVE":"Not yet certified",cx2+16,cy2+158,14,cert?C.teal:C.coral,800);
  const pass = dr>=99 && cs>=90;
  txt(pass?"Level passed — 99% standard met.":"Below the 99% standard — keep training.",x+28,y+h-52,13,pass?C.teal:C.gold,700);
  ctx.fillStyle=C.teal;rr(x+28,y+h-40,210,30,8);ctx.fill();
  txt("Press Enter — next level",x+38,y+h-20,13,"#04201d",800);
}
function gameoverCard(){ctx.fillStyle="rgba(8,12,16,.8)";ctx.fillRect(0,0,VW,VH);
  const w=440,h=160,x=VW/2-w/2,y=VH/2-h/2;panel(x,y,w,h,.98);
  txt("ROUTE TERMINATED",x+24,y+38,20,C.coral,800);
  wrapText("Service quality dropped below the acceptable threshold. In real life, that's a service review.",x+24,y+64,w-48,13,C.ink);
  mono("Final score "+score,x+24,y+h-44,16,C.ink);
  txt("Press Enter — restart training",x+w-24,y+h-24,12.5,C.muted,600,"right");ctx.textAlign="left";}
function titleCard(){ctx.fillStyle=C.asphalt;ctx.fillRect(0,0,VW,VH);
  const w=560,h=290,x=VW/2-w/2,y=VH/2-h/2;panel(x,y,w,h,.96);
  txt("COURIER TRAINING",x+30,y+50,30,C.ink,800);txt("DELIVERY SIM",x+30,y+74,15,C.teal,800);
  wrapText("A full shift: drive the highway to the terminal, check in and find your cage, load the van by zone in the loading game, then run a 15-stop mixed route — home, ICA collection points and iBoxen lockers.",x+30,y+102,w-60,13,C.muted);
  wrapText("Deliver exactly as instructed, beat the ETA, never falsely complete. Certify when your career hits a 99% delivery rate with 90%+ customer satisfaction.",x+30,y+158,w-60,13,C.muted);
  ctx.fillStyle=C.teal;rr(x+30,y+h-44,180,30,8);ctx.fill();txt("Press Enter to start",x+40,y+h-24,13.5,"#04201d",800);}

requestAnimationFrame(loop);
})();
